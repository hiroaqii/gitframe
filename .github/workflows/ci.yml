name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Zig 0.16.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]

    defaults:
      run:
        working-directory: gitframe

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: gitframe
          persist-credentials: false

      # Match the sibling path dependencies in GitFrame's build.zig.zon.
      - name: Checkout Chasen
        uses: actions/checkout@v6
        with:
          repository: hiroaqii/chasen
          ref: main
          path: chasen
          persist-credentials: false

      - name: Checkout Chasen UI
        uses: actions/checkout@v6
        with:
          repository: hiroaqii/chasen-ui
          ref: main
          path: chasen-ui
          persist-credentials: false

      - name: Record dependency commits
        run: |
          git -C ../chasen log -1 --format='Chasen: %H'
          git -C ../chasen-ui log -1 --format='Chasen UI: %H'

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build --summary all

      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: zig build test --summary all
